<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes Generator </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libertinus+Math&family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
</head>

<body>
    <div class="container">
        <div class="quote-card">
            <h1 class="pri-h">Quote of the Day</h1>
            <div class="main">
                <div id="quote-txt" class="fade-in-quote"></div>
                <span id="reference" class="fade-in-quote"></span>
            </div>
            <div class="buttons">
                <button class="btn" id="new-quote" onclick="getqoute(api_url)">New Quote</button>
                <button class="btn" id="copyquote">
                    <span class="material-symbols-outlined">
                        content_copy
                    </span>Copy Quote</button>
                <button class="btn" onclick="tweet()">
                    <img src="https://img.icons8.com/ios-filled/50/twitterx--v1.png" alt="twitterx--v1" />Tweet</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
